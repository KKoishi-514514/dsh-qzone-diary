<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小鲸说说日记">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4b86"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e6ff"/>
      <stop offset="1" stop-color="#63c4f2"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ocean)"/>

  <!-- 水面的一道浅光 -->
  <path d="M8 52c6-3 12-3 18 0s12 3 18 0 8-2 12 0" fill="none" stroke="#2f6ea8" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- 小鲸鱼：身子 -->
  <path d="M9 41.5c0-8 7.7-13.2 16.9-13.2s16.6 5 16.6 12.7c0 2.7 1.6 4.1 3.9 4.1h.4c-1.7 4.4-5.9 6.9-11.1 6.9H19.4C13.1 52 9 47.8 9 41.5z" fill="url(#whale)"/>
  <!-- 尾巴 -->
  <path d="M46.4 41c3.9-1 6.9-4 8-7.9 2 4.7.8 9.4-2.8 12.3-1.7-1.5-3.6-2.6-5.2-4.4z" fill="#8fdcff"/>
  <!-- 眼睛 -->
  <circle cx="19.5" cy="37" r="1.9" fill="#0d2544"/>
  <!-- 肚皮 -->
  <path d="M17 48.6c3.4-2.6 9.8-3.8 15.9-3.1" fill="none" stroke="#e6f8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- 日记本 -->
  <rect x="34.5" y="8.5" width="17" height="21" rx="3" fill="#f7fbff"/>
  <path d="M38.5 14.5h9M38.5 18.5h9M38.5 22.5h6" stroke="#3f7fbf" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M34.5 12.5h-2.2" stroke="#cfdded" stroke-width="2.4" stroke-linecap="round"/>
</svg>
